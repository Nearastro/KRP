<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NearsX - Workspace</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#09090b', /* zinc-950 */
                        surface: '#18181b',    /* zinc-900 */
                        border: '#27272a',     /* zinc-800 */
                        primary: '#f4f4f5',    /* zinc-100 */
                        secondary: '#a1a1aa',  /* zinc-400 */
                    }
                } 
            }
        }
    </script>
    
    <!-- Lucide Icons & Marked -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        
        body { background-color: #09090b; color: #f4f4f5; font-family: 'Inter', sans-serif; }
        
        .typing-cursor::after { 
            content: ''; display: inline-block; width: 5px; height: 1em; 
            background-color: #f4f4f5; margin-left: 2px; vertical-align: text-bottom; 
            animation: blink 1s step-start infinite; 
        }
        @keyframes blink { 50% { opacity: 0; } }
        
        /* Markdown Styling - Clean */
        .markdown-body { font-size: 0.95rem; line-height: 1.7; color: #e4e4e7; }
        .markdown-body p { margin-bottom: 1.25rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.25rem; margin-bottom: 1.25rem; }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }
        .markdown-body strong { color: #ffffff; font-weight: 600; }
        .markdown-body a { color: #60a5fa; text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }
        
        /* Code Block */
        .markdown-body code { 
            font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.85em; 
            padding: 0.2em 0.4em; background: #27272a; color: #f4f4f5; 
            border-radius: 0.25rem; 
        }
        .markdown-body pre { margin: 0; }
        .markdown-body pre code { background: transparent; padding: 0; color: inherit; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex overflow-hidden antialiased selection:bg-zinc-800 selection:text-white">

    <aside id="sidebar" class="w-[260px] bg-background border-r border-border flex-shrink-0 flex flex-col transition-transform duration-300 md:relative absolute z-30 h-full -translate-x-full md:translate-x-0">
        <div class="h-14 flex items-center justify-between px-4 py-4">
            <span class="text-base font-semibold tracking-tight text-primary flex items-center gap-2">
                <i data-lucide="hexagon" class="w-5 h-5"></i> NearsX.
            </span>
            <button onclick="toggleSidebar()" class="md:hidden text-secondary hover:text-primary transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="px-3 pb-3">
            <button onclick="createNewChat()" class="w-full flex items-center justify-between px-3 py-2 rounded-lg bg-surface border border-border hover:bg-zinc-800 transition-colors text-sm font-medium text-primary shadow-sm">
                <span class="flex items-center gap-2"><i data-lucide="square-pen" class="w-4 h-4 text-secondary"></i> Chat Baru</span>
            </button>
        </div>
        
        <div class="px-4 pt-4 pb-2 text-xs font-medium text-secondary">Riwayat Percakapan</div>
        <div class="flex-1 overflow-y-auto px-2 space-y-0.5 no-scrollbar" id="chat-history-list"></div>

        <div class="p-3 border-t border-border flex justify-between items-center bg-background">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-full bg-zinc-800 flex items-center justify-center text-xs font-medium border border-zinc-700">US</div>
                <span class="font-medium text-sm text-primary">Workspace</span>
            </div>
            <button onclick="clearAllHistory()" class="text-secondary hover:text-red-400 p-2 rounded-lg hover:bg-zinc-900 transition-colors" title="Hapus Riwayat">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
        </div>
    </aside>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-20 hidden md:hidden transition-opacity"></div>

    <main class="flex-1 flex flex-col h-full relative w-full bg-background">
        
        <header class="h-14 flex items-center justify-between px-4 sticky top-0 z-10 bg-background/90 backdrop-blur-sm border-b border-border/50">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-secondary hover:text-primary transition-colors p-1 -ml-1">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="relative flex items-center">
                    <select id="model-selector" class="appearance-none bg-transparent hover:bg-surface border border-transparent hover:border-border text-sm rounded-lg pl-2 pr-8 py-1.5 outline-none text-primary cursor-pointer transition-colors font-medium">
                    </select>
                    <i data-lucide="chevron-down" class="absolute right-2 text-secondary pointer-events-none w-4 h-4"></i>
                </div>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto px-4 md:px-0 py-6 space-y-8 pb-32 scroll-smooth flex flex-col items-center">
            
            <div id="welcome-screen" class="h-full w-full max-w-2xl flex flex-col items-center justify-center text-center mt-8 md:mt-16 transition-opacity duration-500">
                <div class="w-14 h-14 rounded-2xl bg-surface border border-border flex items-center justify-center mb-6 shadow-sm">
                    <i data-lucide="layers" class="w-7 h-7 text-secondary"></i>
                </div>
                <h1 class="text-2xl md:text-3xl font-semibold mb-2 tracking-tight text-primary">Apa yang bisa saya bantu?</h1>
                <p class="text-secondary text-sm mb-10">Kirim pesan, unggah dokumen, atau tulis kode.</p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full">
                    <button onclick="setSuggestion('Bantu saya merapikan kode Python ini')" class="p-3.5 rounded-xl border border-border bg-surface/50 hover:bg-surface transition-colors text-left flex items-start gap-3 group">
                        <i data-lucide="code" class="w-5 h-5 text-secondary group-hover:text-primary mt-0.5 transition-colors"></i>
                        <div class="flex flex-col">
                            <span class="text-primary text-sm font-medium">Review Kode</span>
                            <span class="text-secondary text-xs mt-0.5">Bantu rapikan sintaks Python</span>
                        </div>
                    </button>
                    <button onclick="setSuggestion('Tuliskan draft email profesional untuk klien')" class="p-3.5 rounded-xl border border-border bg-surface/50 hover:bg-surface transition-colors text-left flex items-start gap-3 group">
                        <i data-lucide="mail" class="w-5 h-5 text-secondary group-hover:text-primary mt-0.5 transition-colors"></i>
                        <div class="flex flex-col">
                            <span class="text-primary text-sm font-medium">Draft Email</span>
                            <span class="text-secondary text-xs mt-0.5">Email profesional ke klien</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 w-full bg-gradient-to-t from-background via-background to-transparent pt-8 pb-6 px-4 md:px-0 flex justify-center z-10">
            <form id="chat-form" class="w-full max-w-3xl relative">
                
                <div class="relative flex flex-col bg-surface rounded-2xl border border-border shadow-sm transition-all focus-within:border-zinc-600 focus-within:ring-1 focus-within:ring-zinc-600/50">
                    <div id="file-preview-container" class="flex gap-2 px-3 pt-3 overflow-x-auto hidden"></div>
                    
                    <textarea id="user-input" rows="1" class="w-full bg-transparent text-primary pt-4 pb-12 px-4 resize-none outline-none max-h-[200px] text-[15px] placeholder-zinc-500 leading-relaxed" placeholder="Ketik pesan ke NearsX..."></textarea>
                    
                    <div class="absolute bottom-2 left-2 right-2 flex justify-between items-center">
                        <div>
                            <label for="file-upload" class="p-2 text-secondary hover:text-primary hover:bg-zinc-800 rounded-lg cursor-pointer transition-colors flex items-center justify-center" title="Lampirkan File">
                                <i data-lucide="paperclip" class="w-5 h-5"></i>
                            </label>
                            <input type="file" id="file-upload" class="hidden" multiple accept="image/*,.pdf,.txt,.json,.csv,.js,.py,.html">
                        </div>
                        
                        <button type="submit" id="send-btn" class="p-2 bg-zinc-200 text-zinc-950 hover:bg-white rounded-lg transition-all disabled:opacity-40 disabled:bg-zinc-800 disabled:text-zinc-500 flex items-center justify-center" disabled>
                            <i data-lucide="arrow-up" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                
                <div class="text-center mt-3">
                    <span class="text-[10px] text-zinc-500 font-medium tracking-wide">AI dapat membuat kesalahan. Periksa kembali info penting.</span>
                </div>
            </form>
        </div>
    </main>

    <script>
        const WORKER_URL = "http://116.212.73.233:8080/"; 
        
        const MODELS = [
            "gpt-4o", "gpt-5.5", "claude-opus-4.8", "claude-sonnet-5", 
            "deepseek-r1", "deepseek-v3", "deepseek-v4-flash", "gemini-2.0-flash", 
            "gemini-2.5-pro", "grok-4.6"
        ];
        
        let chatHistory = JSON.parse(localStorage.getItem('nearsx_history')) || [];
        let currentConvId = null;
        let isGenerating = false;
        let selectedFiles = [];

        const ui = {
            chatContainer: document.getElementById('chat-container'),
            chatForm: document.getElementById('chat-form'),
            userInput: document.getElementById('user-input'),
            historyList: document.getElementById('chat-history-list'),
            modelSelector: document.getElementById('model-selector'),
            welcomeScreen: document.getElementById('welcome-screen'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            sendBtn: document.getElementById('send-btn'),
            fileInput: document.getElementById('file-upload'),
            filePreview: document.getElementById('file-preview-container')
        };

        function init() {
            MODELS.forEach(m => {
                const opt = new Option(m, m);
                if(m === 'gpt-4o') opt.selected = true;
                ui.modelSelector.add(opt);
            });
            lucide.createIcons();
            renderHistory();
            if (chatHistory.length > 0) loadConv(chatHistory[0].id);
        }

        const genId = () => Math.random().toString(36).substring(2, 15);

        function toggleSidebar() {
            ui.sidebar.classList.toggle('-translate-x-full');
            ui.sidebarOverlay.classList.toggle('hidden');
        }

        function setSuggestion(text) {
            ui.userInput.value = text;
            ui.userInput.focus();
            autoResizeTextarea();
            checkInputState();
        }

        function createNewChat() {
            currentConvId = genId();
            ui.chatContainer.innerHTML = '';
            ui.chatContainer.appendChild(ui.welcomeScreen);
            ui.welcomeScreen.style.display = 'flex';
            clearFiles();
            if(window.innerWidth < 768 && !ui.sidebar.classList.contains('-translate-x-full')) toggleSidebar();
        }

        function saveHistory(role, content, attachments = []) {
            if (!currentConvId) currentConvId = genId();
            let conv = chatHistory.find(c => c.id === currentConvId);
            if (!conv) {
                const title = content.split(' ').slice(0, 5).join(' ') + '...';
                conv = { id: currentConvId, title: title, messages: [] };
                chatHistory.unshift(conv);
            }
            conv.messages.push({ role, content, attachments });
            localStorage.setItem('nearsx_history', JSON.stringify(chatHistory));
            renderHistory();
        }

        function renderHistory() {
            ui.historyList.innerHTML = '';
            chatHistory.forEach(conv => {
                const isActive = conv.id === currentConvId;
                const div = document.createElement('div');
                div.className = `group flex justify-between items-center p-2 rounded-lg cursor-pointer text-sm transition-colors ${isActive ? 'bg-zinc-800 text-primary' : 'text-secondary hover:bg-surface hover:text-primary'}`;
                div.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden w-full" onclick="loadConv('${conv.id}')">
                        <span class="truncate font-medium">${conv.title}</span>
                    </div>
                    <button class="opacity-0 group-hover:opacity-100 text-zinc-500 hover:text-red-400 transition-all ml-2 p-1" onclick="deleteChat('${conv.id}', event)">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                ui.historyList.appendChild(div);
            });
            lucide.createIcons({ root: ui.historyList });
        }

        function loadConv(id) {
            currentConvId = id;
            const conv = chatHistory.find(c => c.id === id);
            ui.chatContainer.innerHTML = '';
            ui.welcomeScreen.style.display = 'none';
            if (conv) conv.messages.forEach(msg => appendMsg(msg.role, msg.content, false, msg.attachments));
            renderHistory();
            if(window.innerWidth < 768 && !ui.sidebar.classList.contains('-translate-x-full')) toggleSidebar();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            chatHistory = chatHistory.filter(c => c.id !== id);
            localStorage.setItem('nearsx_history', JSON.stringify(chatHistory));
            if (currentConvId === id) createNewChat(); else renderHistory();
        }

        function clearAllHistory() {
            if(confirm('Hapus semua riwayat percakapan?')) {
                chatHistory = []; localStorage.removeItem('nearsx_history');
                createNewChat(); renderHistory();
            }
        }

        function formatCodeBlocks(container) {
            const pres = container.querySelectorAll('pre');
            pres.forEach(pre => {
                if (pre.parentNode.classList.contains('code-wrapper')) return;
                
                const codeNode = pre.querySelector('code');
                const lang = codeNode && codeNode.className ? codeNode.className.replace('language-', '') : 'text';
                const codeText = codeNode ? codeNode.innerText : pre.innerText;

                const wrapper = document.createElement('div');
                wrapper.className = 'code-wrapper my-4 rounded-xl overflow-hidden bg-zinc-950 border border-border shadow-sm';
                
                const header = document.createElement('div');
                header.className = 'flex justify-between items-center px-4 py-2 bg-zinc-900 border-b border-border text-xs text-secondary font-mono';
                header.innerHTML = `
                    <span class="lowercase">${lang}</span>
                    <button class="copy-btn flex items-center gap-1.5 hover:text-primary transition-colors">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i> <span>Salin</span>
                    </button>
                `;
                
                const copyBtn = header.querySelector('.copy-btn');
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(codeText).then(() => {
                        copyBtn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5 text-green-500"></i> <span class="text-green-500">Tersalin</span>';
                        lucide.createIcons({ root: copyBtn });
                        setTimeout(() => {
                            copyBtn.innerHTML = '<i data-lucide="copy" class="w-3.5 h-3.5"></i> <span>Salin</span>';
                            lucide.createIcons({ root: copyBtn });
                        }, 2000);
                    });
                });

                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(header);
                
                const codeContent = document.createElement('div');
                codeContent.className = 'p-4 overflow-x-auto text-[13px] leading-relaxed font-mono';
                codeContent.appendChild(pre);
                wrapper.appendChild(codeContent);
            });
            lucide.createIcons({ root: container });
        }

        function generateAttachmentHTML(attachments) {
            if (!attachments || attachments.length === 0) return '';
            let html = `<div class="flex flex-wrap gap-2 mb-3">`;
            attachments.forEach(att => {
                if (att.type && att.type.startsWith('image/')) {
                    html += `<img src="${att.url}" class="h-20 w-auto rounded-lg border border-border object-cover shadow-sm">`;
                } else {
                    html += `<div class="flex items-center gap-2 bg-background px-3 py-1.5 rounded-lg border border-border text-xs font-medium text-primary"><i data-lucide="file-text" class="w-3.5 h-3.5 text-secondary"></i> ${att.name}</div>`;
                }
            });
            html += `</div>`;
            return html;
        }

        function appendMsg(role, content, isTyping = false, attachments = []) {
            ui.welcomeScreen.style.display = 'none';
            
            const div = document.createElement('div');
            div.className = `flex w-full max-w-3xl mb-6 ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const attachmentHTML = generateAttachmentHTML(attachments);

            if (role === 'user') {
                div.innerHTML = `
                    <div class="px-5 py-3 rounded-2xl rounded-tr-sm bg-zinc-800 text-primary max-w-[85%] text-[15px] leading-relaxed shadow-sm">
                        ${attachmentHTML}
                        <div>${content}</div>
                    </div>
                `;
                ui.chatContainer.appendChild(div);
            } else {
                div.innerHTML = `
                    <div class="text-primary markdown-body w-full max-w-full overflow-hidden flex gap-4">
                        <div class="w-8 h-8 rounded-full border border-border flex items-center justify-center flex-shrink-0 mt-0.5 bg-background shadow-sm">
                            <i data-lucide="hexagon" class="w-4 h-4 text-primary"></i>
                        </div>
                        <div class="flex-1 min-w-0 content-wrapper"></div>
                    </div>
                `;
                ui.chatContainer.appendChild(div);
                lucide.createIcons({ root: div });
                
                const contentWrapper = div.querySelector('.content-wrapper');

                if (isTyping) {
                    contentWrapper.classList.add('typing-cursor');
                    let i = 0;
                    const speed = content.length > 500 ? 1 : 4; 
                    const interval = setInterval(() => {
                        if (i < content.length) {
                            contentWrapper.innerHTML = marked.parse(content.substring(0, i + 3));
                            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight; 
                            i += 3;
                        } else {
                            clearInterval(interval);
                            contentWrapper.classList.remove('typing-cursor');
                            contentWrapper.innerHTML = marked.parse(content);
                            formatCodeBlocks(contentWrapper);
                            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
                        }
                    }, speed);
                } else {
                    contentWrapper.innerHTML = marked.parse(content);
                    formatCodeBlocks(contentWrapper);
                }
            }
            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
        }

        ui.fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (selectedFiles.length + files.length > 5) {
                alert("Maksimal 5 file."); return;
            }
            selectedFiles = [...selectedFiles, ...files];
            renderFilePreviews();
            checkInputState();
            ui.fileInput.value = ''; 
        });

        function renderFilePreviews() {
            if (selectedFiles.length === 0) {
                ui.filePreview.classList.add('hidden');
                ui.filePreview.innerHTML = '';
                return;
            }
            ui.filePreview.classList.remove('hidden');
            ui.filePreview.innerHTML = '';
            
            selectedFiles.forEach((file, index) => {
                const isImage = file.type.startsWith('image/');
                const div = document.createElement('div');
                div.className = "relative group flex-shrink-0 mb-2";
                
                if (isImage) {
                    const url = URL.createObjectURL(file);
                    div.innerHTML = `<div class="h-12 w-12 rounded-lg border border-border overflow-hidden bg-background"><img src="${url}" class="h-full w-full object-cover opacity-90 group-hover:opacity-100 transition-opacity"></div>`;
                } else {
                    div.innerHTML = `<div class="h-12 w-12 flex flex-col items-center justify-center bg-background rounded-lg border border-border text-[9px] text-secondary p-1"><i data-lucide="file-text" class="w-4 h-4 mb-1"></i><span class="truncate w-full text-center">${file.name}</span></div>`;
                }
                
                div.innerHTML += `
                    <button type="button" onclick="removeFile(${index})" class="absolute -top-2 -right-2 bg-zinc-700 text-white rounded-full w-4 h-4 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-sm border border-zinc-600 hover:bg-zinc-600">
                        <i data-lucide="x" class="w-2.5 h-2.5"></i>
                    </button>
                `;
                ui.filePreview.appendChild(div);
            });
            lucide.createIcons({ root: ui.filePreview });
        }

        window.removeFile = function(index) {
            selectedFiles.splice(index, 1);
            renderFilePreviews();
            checkInputState();
        }

        function clearFiles() { selectedFiles = []; renderFilePreviews(); }

        function autoResizeTextarea() {
            ui.userInput.style.height = 'auto';
            let newHeight = ui.userInput.scrollHeight;
            ui.userInput.style.height = (newHeight > 200 ? 200 : newHeight) + 'px';
        }
        
        function checkInputState() {
            if(ui.userInput.value.trim() !== '' || selectedFiles.length > 0) {
                ui.sendBtn.removeAttribute('disabled');
            } else {
                ui.sendBtn.setAttribute('disabled', 'true');
            }
        }

        ui.userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                if(!isGenerating && (ui.userInput.value.trim() !== '' || selectedFiles.length > 0)) {
                    ui.chatForm.dispatchEvent(new Event('submit')); 
                }
            }
        });
        ui.userInput.addEventListener('input', () => { autoResizeTextarea(); checkInputState(); });

        // --- SISTEM FETCHING LAMA (DIKEMBALIKAN 100% SAMA KAYA REQUEST) TAPI PARSING DIBENERIN ---
        ui.chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isGenerating) return;
            
            const question = ui.userInput.value.trim();
            if (!question && selectedFiles.length === 0) return;

            const currentFiles = [...selectedFiles];
            const attachmentsForHistory = currentFiles.map(f => ({
                name: f.name,
                type: f.type,
                url: f.type.startsWith('image/') ? URL.createObjectURL(f) : null
            }));

            ui.userInput.value = '';
            ui.userInput.style.height = 'auto';
            clearFiles();
            checkInputState();
            
            appendMsg('user', question, false, attachmentsForHistory);
            saveHistory('user', question, attachmentsForHistory);
            
            isGenerating = true;
            ui.sendBtn.setAttribute('disabled', 'true');
            ui.sendBtn.innerHTML = '<i data-lucide="loader-circle" class="w-5 h-5 animate-spin"></i>';
            lucide.createIcons({ root: ui.sendBtn });

            // Div loading efek titik mantul
            const loadingDiv = document.createElement('div');
            loadingDiv.className = "flex w-full max-w-3xl mb-6 justify-start";
            loadingDiv.innerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full border border-border flex items-center justify-center flex-shrink-0 mt-0.5 bg-background shadow-sm"><i data-lucide="hexagon" class="w-4 h-4 text-secondary"></i></div>
                    <div class="flex items-center gap-1.5 h-9 px-2">
                        <div class="w-1.5 h-1.5 rounded-full bg-secondary animate-bounce" style="animation-delay: 0s"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-secondary animate-bounce" style="animation-delay: 0.15s"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-secondary animate-bounce" style="animation-delay: 0.3s"></div>
                    </div>
                </div>
            `;
            ui.chatContainer.appendChild(loadingDiv);
            lucide.createIcons({ root: loadingDiv });
            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;

            try {
                let fetchOptions = { method: 'POST' };

                if (currentFiles.length > 0) {
                    const formData = new FormData();
                    formData.append('question', question || "Analyze this file.");
                    formData.append('model', ui.modelSelector.value);
                    formData.append('conversationId', currentConvId || genId());
                    formData.append('webSearch', 'true');
                    
                    currentFiles.forEach(file => { formData.append('files', file); });
                    fetchOptions.body = formData;
                } else {
                    fetchOptions.headers = { 'Content-Type': 'application/json' };
                    fetchOptions.body = JSON.stringify({
                        question: question,
                        model: ui.modelSelector.value,
                        conversationId: currentConvId || genId(),
                        webSearch: true
                    });
                }

                // FETCH PERSIS KAYA KODE AWAL LU
                const response = await fetch(WORKER_URL, fetchOptions);
                const rawText = await response.text();
                
                ui.chatContainer.removeChild(loadingDiv);
                
                let aiReply = "";

                // PERBAIKAN LOGIKA PARSING SSE DISINI
                if (rawText.includes('data:')) {
                    const lines = rawText.split('\n');
                    for (let line of lines) {
                        line = line.trim();
                        if (line.startsWith('data:')) {
                            const jsonStr = line.replace(/^data:\s*/, '').trim();
                            if (jsonStr === '[DONE]' || !jsonStr) continue;
                            try {
                                const parsed = JSON.parse(jsonStr);
                                aiReply += (parsed.response || parsed.message || parsed.text || parsed.content || "");
                            } catch (err) {
                                // Skip baris error secara sunyi, nggak bikin crash `Unexpected token`
                            }
                        }
                    }
                } 
                
                // Fallback kalau bukan format data:
                if (!aiReply) {
                    try {
                        const parsed = JSON.parse(rawText);
                        aiReply = parsed.response || parsed.message || parsed.text || parsed.answer || JSON.stringify(parsed);
                    } catch (err) {
                        aiReply = rawText; // kalau plain text biasa
                    }
                }

                if (!aiReply.trim()) aiReply = "⚠️ Respon kosong dari server API.";

                // Eksekusi ngetik otomatis (isTyping = true)
                appendMsg('ai', aiReply, true);
                saveHistory('ai', aiReply);

            } catch (error) {
                if (ui.chatContainer.contains(loadingDiv)) ui.chatContainer.removeChild(loadingDiv);
                appendMsg('ai', "⚠️ **Connection Error:** " + error.message, false);
            } finally {
                isGenerating = false;
                ui.sendBtn.innerHTML = '<i data-lucide="arrow-up" class="w-5 h-5"></i>';
                lucide.createIcons({ root: ui.sendBtn });
                checkInputState();
            }
        });

        init();
    </script>
</body>
</html>
