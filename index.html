<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NearsX - Workspace</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#09090b', /* Zinc 950 */
                        surface: '#18181b',    /* Zinc 900 */
                        border: '#27272a',     /* Zinc 800 */
                        primary: '#f4f4f5',    /* Zinc 100 */
                        secondary: '#a1a1aa'   /* Zinc 400 */
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                } 
            }
        }
    </script>
    
    <!-- Lucide Icons & Marked -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* Scrollbar Elegan */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        
        .typing-cursor::after { content: ''; display: inline-block; width: 4px; height: 1em; background-color: #f4f4f5; margin-left: 4px; vertical-align: text-bottom; animation: blink 1s step-start infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        
        /* Markdown Styles */
        .markdown-body { color: #e4e4e7; font-size: 0.95rem; line-height: 1.7; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body ul, .markdown-body ol { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; color: #d4d4d8; }
        .markdown-body strong { color: #ffffff; font-weight: 600; }
        .markdown-body img { max-width: 100%; border-radius: 0.5rem; margin-top: 0.5rem; border: 1px solid #27272a; }
        
        .markdown-body code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.85em; padding: 0.2em 0.4em; background: #27272a; color: #f4f4f5; border-radius: 0.3em; border: 1px solid #3f3f46; }
        .markdown-body pre { margin: 0; }
        .markdown-body pre code { background: transparent; border: none; padding: 0; color: #e4e4e7; }
        
        body { background-color: #09090b; color: #f4f4f5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        textarea { transition: height 0.1s ease; }
        
        /* Icon penyesuaian */
        .lucide { stroke-width: 1.5; }
    </style>
</head>
<body class="h-screen flex overflow-hidden font-sans antialiased selection:bg-neutral-700 selection:text-white">

    <!-- Sidebar Minimalis -->
    <aside id="sidebar" class="w-[260px] bg-background border-r border-border flex-shrink-0 flex flex-col transition-transform duration-300 md:relative absolute z-30 h-full -translate-x-full md:translate-x-0 shadow-xl md:shadow-none">
        <div class="h-14 flex items-center px-5 py-4">
            <span class="text-[17px] font-semibold tracking-tight text-primary flex items-center gap-2">
                <i data-lucide="box" class="w-5 h-5 text-secondary"></i>
                NearsX.
            </span>
            <button onclick="toggleSidebar()" class="md:hidden ml-auto text-secondary hover:text-primary transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="px-3 pb-3">
            <button onclick="createNewChat()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg bg-surface border border-border hover:border-[#3f3f46] transition-colors text-sm font-medium text-primary shadow-sm">
                <span class="flex items-center gap-2"><i data-lucide="square-pen" class="w-4 h-4 text-secondary"></i> New chat</span>
                <i data-lucide="plus" class="w-4 h-4 text-secondary"></i>
            </button>
        </div>
        
        <div class="px-4 pt-2 pb-1 text-[11px] font-semibold text-secondary uppercase tracking-wider">History</div>
        <div class="flex-1 overflow-y-auto px-2 space-y-0.5 no-scrollbar" id="chat-history-list"></div>

        <div class="p-4 border-t border-border flex justify-between items-center bg-background">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-surface border border-border flex items-center justify-center text-xs font-medium">US</div>
                <span class="font-medium text-sm text-primary">Workspace</span>
            </div>
            <button onclick="clearAllHistory()" class="text-secondary hover:text-red-400 transition-colors p-1.5 rounded-md hover:bg-red-400/10" title="Clear History">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
        </div>
    </aside>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-20 hidden transition-opacity"></div>

    <main class="flex-1 flex flex-col h-full relative w-full bg-background">
        
        <header class="h-14 flex items-center justify-between px-4 sticky top-0 z-10 bg-background/80 backdrop-blur-md border-b border-border/40">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-secondary hover:text-primary transition-colors">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="relative">
                    <select id="model-selector" class="appearance-none bg-transparent hover:bg-surface border border-transparent hover:border-border text-sm rounded-lg pl-3 pr-8 py-1.5 outline-none text-primary cursor-pointer transition-colors font-medium">
                    </select>
                    <i data-lucide="chevron-down" class="absolute right-2 top-1/2 -translate-y-1/2 w-4 h-4 text-secondary pointer-events-none"></i>
                </div>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto px-4 md:px-0 py-6 space-y-8 pb-48 scroll-smooth flex flex-col items-center">
            <div id="welcome-screen" class="h-full w-full max-w-3xl flex flex-col items-center justify-center text-center animate-fade-in mt-6">
                <div class="w-16 h-16 rounded-2xl bg-surface border border-border flex items-center justify-center mb-6 shadow-sm">
                    <i data-lucide="sparkles" class="w-8 h-8 text-secondary"></i>
                </div>
                <h1 class="text-2xl md:text-3xl font-semibold mb-3 tracking-tight text-primary">How can I help you today?</h1>
                <p class="text-secondary text-sm max-w-sm">
                    Upload documents, analyze code, or start a new conversation.
                </p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-10 w-full max-w-xl">
                    <button onclick="setSuggestion('Bantu saya merapikan kode Python ini')" class="p-4 rounded-xl border border-border bg-surface hover:bg-[#27272a] transition-colors text-left flex flex-col gap-2 group shadow-sm">
                        <span class="text-primary text-sm font-medium flex items-center gap-2"><i data-lucide="code" class="w-4 h-4 text-secondary"></i>Code Review</span>
                        <span class="text-secondary text-xs">Bantu saya merapikan kode Python ini</span>
                    </button>
                    <button onclick="setSuggestion('Tuliskan draft email profesional untuk klien')" class="p-4 rounded-xl border border-border bg-surface hover:bg-[#27272a] transition-colors text-left flex flex-col gap-2 group shadow-sm">
                        <span class="text-primary text-sm font-medium flex items-center gap-2"><i data-lucide="mail" class="w-4 h-4 text-secondary"></i>Draft Email</span>
                        <span class="text-secondary text-xs">Tuliskan draft email profesional untuk klien</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 w-full bg-gradient-to-t from-background via-background to-transparent pt-12 pb-6 px-4 flex justify-center z-10">
            <form id="chat-form" class="w-full max-w-3xl relative">
                <!-- Wrapper Input Elegan -->
                <div class="relative flex flex-col bg-surface rounded-2xl border border-border shadow-lg transition-colors focus-within:border-[#52525b]">
                    <div id="file-preview-container" class="flex gap-2 px-3 pt-3 overflow-x-auto hidden border-b border-border/50 pb-2"></div>
                    
                    <div class="flex items-end relative p-2 min-h-[56px]">
                        <label for="file-upload" class="p-2.5 text-secondary hover:text-primary cursor-pointer transition-colors shrink-0 rounded-lg hover:bg-[#27272a] flex items-center justify-center" title="Attach Files">
                            <i data-lucide="paperclip" class="w-5 h-5"></i>
                        </label>
                        <input type="file" id="file-upload" class="hidden" multiple accept="image/*,.pdf,.txt,.json,.csv,.js,.py,.html">
                        
                        <textarea id="user-input" rows="1" class="w-full bg-transparent text-primary py-2.5 px-2 resize-none outline-none max-h-48 text-[15px] placeholder-secondary leading-relaxed" placeholder="Message NearsX..."></textarea>
                        
                        <button type="submit" id="send-btn" class="p-2 ml-1 rounded-xl bg-primary text-background hover:bg-white transition-all duration-200 disabled:opacity-40 disabled:bg-surface disabled:text-secondary disabled:border disabled:border-border flex items-center justify-center shrink-0 w-9 h-9 border border-transparent shadow-sm" disabled>
                            <i data-lucide="arrow-up" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <span class="text-[11px] text-neutral-500 font-medium">NearsX AI can make mistakes. Consider verifying important information.</span>
                </div>
            </form>
        </div>
    </main>

    <script>
        // === ROOT IP KAMU ===
        const WORKER_URL = "http://116.212.73.233:8080/"; 
        
        const MODELS = [
            "gpt-4o", "gpt-5.5", "claude-opus-4.8", "claude-sonnet-5", 
            "deepseek-r1", "deepseek-v3", "deepseek-v4-flash", "gemini-2.0-flash", 
            "gemini-2.5-pro", "grok-4.6"
        ];
        
        let chatHistory = JSON.parse(localStorage.getItem('nearsx_history')) || [];
        let currentConvId = null;
        let isGenerating = false;
        let selectedFiles = [];

        const ui = {
            chatContainer: document.getElementById('chat-container'),
            chatForm: document.getElementById('chat-form'),
            userInput: document.getElementById('user-input'),
            historyList: document.getElementById('chat-history-list'),
            modelSelector: document.getElementById('model-selector'),
            welcomeScreen: document.getElementById('welcome-screen'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            sendBtn: document.getElementById('send-btn'),
            fileInput: document.getElementById('file-upload'),
            filePreview: document.getElementById('file-preview-container')
        };

        function init() {
            MODELS.forEach(m => {
                const opt = new Option(m, m);
                if(m === 'gpt-4o') opt.selected = true;
                ui.modelSelector.add(opt);
            });
            renderHistory();
            if (chatHistory.length > 0) loadConv(chatHistory[0].id);
            lucide.createIcons();
        }

        const genId = () => Math.random().toString(36).substring(2, 15);

        function toggleSidebar() {
            ui.sidebar.classList.toggle('-translate-x-full');
            ui.sidebarOverlay.classList.toggle('hidden');
        }

        function setSuggestion(text) {
            ui.userInput.value = text;
            ui.userInput.focus();
            autoResizeTextarea();
            checkInputState();
        }

        function createNewChat() {
            currentConvId = genId();
            ui.chatContainer.innerHTML = '';
            ui.chatContainer.appendChild(ui.welcomeScreen);
            ui.welcomeScreen.style.display = 'flex';
            clearFiles();
            if(window.innerWidth < 768 && !ui.sidebar.classList.contains('-translate-x-full')) toggleSidebar();
        }

        function saveHistory(role, content, attachments = []) {
            if (!currentConvId) currentConvId = genId();
            let conv = chatHistory.find(c => c.id === currentConvId);
            if (!conv) {
                const title = content.split(' ').slice(0, 4).join(' ') + '...';
                conv = { id: currentConvId, title: title, messages: [] };
                chatHistory.unshift(conv);
            }
            conv.messages.push({ role, content, attachments });
            localStorage.setItem('nearsx_history', JSON.stringify(chatHistory));
            renderHistory();
        }

        function renderHistory() {
            ui.historyList.innerHTML = '';
            chatHistory.forEach(conv => {
                const isActive = conv.id === currentConvId;
                const div = document.createElement('div');
                div.className = `group flex justify-between items-center p-2 rounded-lg cursor-pointer text-sm transition-colors ${isActive ? 'bg-surface border border-border text-primary font-medium' : 'text-secondary hover:bg-[#27272a] hover:text-primary border border-transparent'}`;
                div.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden w-full px-1" onclick="loadConv('${conv.id}')">
                        <span class="truncate">${conv.title}</span>
                    </div>
                    <button class="opacity-0 group-hover:opacity-100 text-neutral-500 hover:text-red-400 transition-all p-1" onclick="deleteChat('${conv.id}', event)">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                ui.historyList.appendChild(div);
            });
            lucide.createIcons();
        }

        function loadConv(id) {
            currentConvId = id;
            const conv = chatHistory.find(c => c.id === id);
            ui.chatContainer.innerHTML = '';
            ui.welcomeScreen.style.display = 'none';
            if (conv) conv.messages.forEach(msg => appendMsg(msg.role, msg.content, false, msg.attachments));
            renderHistory();
            if(window.innerWidth < 768 && !ui.sidebar.classList.contains('-translate-x-full')) toggleSidebar();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            chatHistory = chatHistory.filter(c => c.id !== id);
            localStorage.setItem('nearsx_history', JSON.stringify(chatHistory));
            if (currentConvId === id) createNewChat(); else renderHistory();
        }

        function clearAllHistory() {
            if(confirm('Clear all conversation history?')) {
                chatHistory = []; localStorage.removeItem('nearsx_history');
                createNewChat(); renderHistory();
            }
        }

        function formatCodeBlocks(container) {
            const pres = container.querySelectorAll('pre');
            pres.forEach(pre => {
                if (pre.parentNode.classList.contains('code-wrapper')) return;
                
                const codeNode = pre.querySelector('code');
                const lang = codeNode && codeNode.className ? codeNode.className.replace('language-', '') : 'text';
                const codeText = codeNode ? codeNode.innerText : pre.innerText;

                const wrapper = document.createElement('div');
                wrapper.className = 'code-wrapper my-4 rounded-xl overflow-hidden bg-[#0a0a0a] border border-border shadow-sm';
                
                const header = document.createElement('div');
                header.className = 'flex justify-between items-center px-4 py-2 bg-surface border-b border-border text-xs text-secondary font-mono';
                header.innerHTML = `
                    <span class="lowercase">${lang}</span>
                    <button class="copy-btn flex items-center gap-1.5 hover:text-primary transition-colors" title="Copy code">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i> <span>Copy</span>
                    </button>
                `;
                
                const copyBtn = header.querySelector('.copy-btn');
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(codeText).then(() => {
                        copyBtn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5 text-green-500"></i> <span class="text-green-500">Copied</span>';
                        lucide.createIcons();
                        setTimeout(() => {
                            copyBtn.innerHTML = '<i data-lucide="copy" class="w-3.5 h-3.5"></i> <span>Copy</span>';
                            lucide.createIcons();
                        }, 2000);
                    });
                });

                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(header);
                
                const codeContent = document.createElement('div');
                codeContent.className = 'p-4 overflow-x-auto text-[13px] leading-relaxed font-mono';
                codeContent.appendChild(pre);
                wrapper.appendChild(codeContent);
            });
            lucide.createIcons();
        }

        function appendMsg(role, content, isStreaming = false, attachments = []) {
            ui.welcomeScreen.style.display = 'none';
            
            const div = document.createElement('div');
            div.className = `flex w-full max-w-3xl animate-fade-in mb-6 ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            let attachmentHTML = '';
            if (attachments && attachments.length > 0) {
                attachmentHTML = `<div class="flex flex-wrap gap-2 mb-2">`;
                attachments.forEach(att => {
                    if (att.type && att.type.startsWith('image/')) {
                        attachmentHTML += `<img src="${att.url}" class="h-24 w-auto rounded-lg border border-border object-cover">`;
                    } else {
                        attachmentHTML += `<div class="flex items-center gap-2 bg-background px-3 py-2 rounded-lg border border-border text-xs font-medium text-primary shadow-sm"><i data-lucide="file-text" class="w-4 h-4 text-secondary"></i> ${att.name}</div>`;
                    }
                });
                attachmentHTML += `</div>`;
            }

            const bubble = document.createElement('div');
            
            if (role === 'user') {
                bubble.className = 'px-5 py-3 rounded-2xl rounded-tr-sm bg-surface border border-border text-primary max-w-[85%] text-[15px] leading-relaxed shadow-sm';
                bubble.innerHTML = attachmentHTML + (content ? `<div>${content}</div>` : '');
                div.appendChild(bubble);
                ui.chatContainer.appendChild(div);
                ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
                lucide.createIcons();
            } else {
                bubble.className = 'text-primary markdown-body w-full max-w-full overflow-hidden flex gap-4';
                
                const avatar = document.createElement('div');
                avatar.className = 'w-7 h-7 rounded-md border border-border flex items-center justify-center flex-shrink-0 mt-0.5 bg-surface shadow-sm';
                avatar.innerHTML = '<i data-lucide="sparkles" class="w-4 h-4 text-primary"></i>';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'flex-1 min-w-0';

                bubble.appendChild(avatar);
                bubble.appendChild(contentDiv);
                div.appendChild(bubble);
                ui.chatContainer.appendChild(div);

                if (isStreaming) {
                    contentDiv.classList.add('typing-cursor');
                    return {
                        update: (text) => {
                            contentDiv.innerHTML = marked.parse(text);
                            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
                        },
                        finish: (text) => {
                            contentDiv.classList.remove('typing-cursor');
                            contentDiv.innerHTML = marked.parse(text);
                            formatCodeBlocks(contentDiv);
                            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
                        }
                    };
                } else {
                    contentDiv.innerHTML = marked.parse(content);
                    formatCodeBlocks(contentDiv);
                    ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
                    lucide.createIcons();
                }
            }
        }

        ui.fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (selectedFiles.length + files.length > 5) {
                alert("Maximum 5 files allowed per message."); return;
            }
            selectedFiles = [...selectedFiles, ...files];
            renderFilePreviews();
            checkInputState();
            ui.fileInput.value = ''; 
        });

        function renderFilePreviews() {
            if (selectedFiles.length === 0) {
                ui.filePreview.classList.add('hidden');
                ui.filePreview.innerHTML = '';
                return;
            }
            ui.filePreview.classList.remove('hidden');
            ui.filePreview.innerHTML = '';
            
            selectedFiles.forEach((file, index) => {
                const isImage = file.type.startsWith('image/');
                const div = document.createElement('div');
                div.className = "relative group flex-shrink-0 mb-1";
                
                if (isImage) {
                    const url = URL.createObjectURL(file);
                    div.innerHTML = `<div class="h-14 w-14 rounded-lg border border-border overflow-hidden bg-background"><img src="${url}" class="h-full w-full object-cover opacity-90 group-hover:opacity-100 transition-opacity"></div>`;
                } else {
                    div.innerHTML = `<div class="h-14 w-14 flex flex-col items-center justify-center bg-background rounded-lg border border-border text-[10px] text-secondary p-1"><i data-lucide="file-text" class="w-5 h-5 mb-1 text-secondary"></i><span class="truncate w-full text-center">${file.name}</span></div>`;
                }
                
                div.innerHTML += `
                    <button type="button" onclick="removeFile(${index})" class="absolute -top-1.5 -right-1.5 bg-surface text-primary rounded-full w-4 h-4 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow border border-border hover:bg-neutral-700">
                        <i data-lucide="x" class="w-2.5 h-2.5"></i>
                    </button>
                `;
                ui.filePreview.appendChild(div);
            });
            lucide.createIcons();
        }

        window.removeFile = function(index) {
            selectedFiles.splice(index, 1);
            renderFilePreviews();
            checkInputState();
        }

        function clearFiles() {
            selectedFiles = [];
            renderFilePreviews();
        }

        function autoResizeTextarea() {
            ui.userInput.style.height = 'auto';
            let newHeight = ui.userInput.scrollHeight;
            ui.userInput.style.height = (newHeight > 200 ? 200 : newHeight) + 'px';
        }
        
        function checkInputState() {
            if(ui.userInput.value.trim() !== '' || selectedFiles.length > 0) {
                ui.sendBtn.removeAttribute('disabled');
            } else {
                ui.sendBtn.setAttribute('disabled', 'true');
            }
        }

        ui.userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                if(!isGenerating && (ui.userInput.value.trim() !== '' || selectedFiles.length > 0)) {
                    ui.chatForm.dispatchEvent(new Event('submit')); 
                }
            }
        });
        ui.userInput.addEventListener('input', () => { autoResizeTextarea(); checkInputState(); });

        // --- PENANGANAN FIX SSE / TRUE STREAMING ---
        ui.chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isGenerating) return;
            
            const question = ui.userInput.value.trim();
            if (!question && selectedFiles.length === 0) return;

            const currentFiles = [...selectedFiles];
            const attachmentsForHistory = currentFiles.map(f => ({
                name: f.name,
                type: f.type,
                url: f.type.startsWith('image/') ? URL.createObjectURL(f) : null
            }));

            ui.userInput.value = '';
            ui.userInput.style.height = 'auto';
            clearFiles();
            checkInputState();
            
            appendMsg('user', question, false, attachmentsForHistory);
            saveHistory('user', question, attachmentsForHistory);
            
            isGenerating = true;
            ui.sendBtn.setAttribute('disabled', 'true');
            ui.sendBtn.innerHTML = '<div class="w-4 h-4 border-2 border-background border-t-transparent rounded-full animate-spin"></div>';

            try {
                let fetchOptions = { method: 'POST' };

                if (currentFiles.length > 0) {
                    const formData = new FormData();
                    formData.append('question', question || "Analyze this file.");
                    formData.append('model', ui.modelSelector.value);
                    formData.append('conversationId', currentConvId || genId());
                    formData.append('webSearch', 'true');
                    
                    currentFiles.forEach(file => { formData.append('files', file); });
                    fetchOptions.body = formData;
                } else {
                    fetchOptions.headers = { 'Content-Type': 'application/json' };
                    fetchOptions.body = JSON.stringify({
                        question: question,
                        model: ui.modelSelector.value,
                        conversationId: currentConvId || genId(),
                        webSearch: true
                    });
                }

                const response = await fetch(WORKER_URL, fetchOptions);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let aiReply = "";
                let buffer = "";

                // Buat template message untuk streaming
                const streamControl = appendMsg('ai', "", true);
                lucide.createIcons();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    
                    // Simpan baris terakhir yang mungkin belum selesai/terpotong ke dalam buffer
                    buffer = lines.pop();

                    for (let line of lines) {
                        line = line.trim();
                        if (!line) continue;
                        
                        // PARSING SSE - Potong kata "data: " supaya ga error JSON.parse
                        if (line.startsWith('data:')) {
                            const dataStr = line.substring(5).trim();
                            if (dataStr === '[DONE]') continue;
                            
                            try {
                                const parsed = JSON.parse(dataStr);
                                const chunkText = parsed.response || parsed.message || parsed.text || parsed.content || parsed.answer || "";
                                if (chunkText) {
                                    aiReply += chunkText;
                                    streamControl.update(aiReply);
                                }
                            } catch (err) {
                                // Abaikan chunk yang gagal diparse
                            }
                        } else if (line.startsWith('{')) {
                            // Fallback jika API membalas full JSON tanpa prefix data:
                            try {
                                const parsed = JSON.parse(line);
                                const chunkText = parsed.response || parsed.message || parsed.text || parsed.content || parsed.answer || "";
                                if (chunkText) {
                                    aiReply += chunkText;
                                    streamControl.update(aiReply);
                                }
                            } catch (err) {}
                        }
                    }
                }

                // Proses sisa text di buffer kalau ada
                if (buffer.trim()) {
                    let finalLine = buffer.trim();
                    if (finalLine.startsWith('data:')) finalLine = finalLine.substring(5).trim();
                    try {
                        const parsed = JSON.parse(finalLine);
                        const chunkText = parsed.response || parsed.message || parsed.text || parsed.content || parsed.answer || "";
                        if (chunkText) aiReply += chunkText;
                    } catch (e) {}
                }

                if (!aiReply.trim()) aiReply = "⚠️ No response received from server.";
                
                // Matikan animasi ngetik, render full markdown + code blocks
                streamControl.finish(aiReply);
                saveHistory('ai', aiReply);

            } catch (error) {
                appendMsg('ai', "⚠️ **Connection Error:** " + error.message, false);
            } finally {
                isGenerating = false;
                ui.sendBtn.innerHTML = '<i data-lucide="arrow-up" class="w-5 h-5"></i>';
                lucide.createIcons();
                checkInputState();
            }
        });

        init();
    </script>
</body>
</html>
