<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NearsX AI - Ultimate</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'gradient': 'gradient 8s linear infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        gradient: {
                            '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
                            '50%': { 'background-size': '200% 200%', 'background-position': 'right center' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        glow: {
                            'from': { 'box-shadow': '0 0 10px #8b5cf6, 0 0 20px #8b5cf6' },
                            'to': { 'box-shadow': '0 0 20px #c084fc, 0 0 30px #c084fc' },
                        }
                    }
                } 
            }
        }
    </script>
    <!-- FontAwesome & Marked (Markdown Parser) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
        
        /* Typing Effect */
        .typing-cursor::after { content: '▋'; animation: blink 1s step-start infinite; color: #a78bfa; text-shadow: 0 0 8px #a78bfa; }
        @keyframes blink { 50% { opacity: 0; } }
        
        /* Markdown Beautification */
        .markdown-body pre { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px); padding: 1rem; border-radius: 0.75rem; overflow-x: auto; margin-top: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.05); }
        .markdown-body code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color: #c084fc; font-size: 0.9em; padding: 0.2em 0.4em; background: rgba(255,255,255,0.05); border-radius: 0.3em; }
        .markdown-body pre code { color: #e2e8f0; background: transparent; padding: 0; }
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body ul { list-style-type: disc; }
        
        /* Background Animated Gradient Mesh */
        body {
            background: radial-gradient(circle at 15% 50%, rgba(20, 10, 40, 1), transparent 50%),
                        radial-gradient(circle at 85% 30%, rgba(15, 20, 50, 1), transparent 50%);
            background-color: #050505;
        }
        
        /* Hide scrollbar for clean chat view but allow scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-white h-screen flex overflow-hidden font-sans antialiased selection:bg-purple-500/30 selection:text-purple-200">

    <!-- Sidebar History (Glassmorphism) -->
    <aside id="sidebar" class="w-72 bg-black/40 backdrop-blur-xl border-r border-white/10 flex-shrink-0 flex flex-col transition-all duration-500 md:relative absolute z-30 h-full -translate-x-full md:translate-x-0 shadow-2xl">
        
        <!-- Logo Area in Sidebar -->
        <div class="h-16 flex items-center px-6 border-b border-white/5">
            <span class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-400 via-fuchsia-400 to-indigo-400 animate-gradient">
                NearsX<span class="text-white">AI</span>
            </span>
            <button onclick="toggleSidebar()" class="md:hidden ml-auto text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <div class="p-4">
            <button onclick="createNewChat()" class="w-full flex items-center justify-center gap-3 p-3 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 transition-all duration-300 shadow-[0_0_15px_rgba(139,92,246,0.3)] hover:shadow-[0_0_25px_rgba(139,92,246,0.5)] text-white font-medium group">
                <i class="fa-solid fa-plus group-hover:rotate-90 transition-transform duration-300"></i> New Chat
            </button>
        </div>
        
        <div class="px-4 pb-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">Recent Chats</div>
        
        <div class="flex-1 overflow-y-auto px-3 space-y-1 no-scrollbar" id="chat-history-list">
            <!-- History Items Injected Here -->
        </div>

        <div class="p-4 border-t border-white/10 bg-white/5 flex justify-between items-center backdrop-blur-md">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-500 to-blue-500 flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-user text-sm"></i>
                </div>
                <span class="font-medium text-sm text-gray-200">NearsX User</span>
            </div>
            <button onclick="clearAllHistory()" class="text-gray-400 hover:text-red-400 transition-colors p-2 rounded-lg hover:bg-white/10" title="Clear All History">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>
    </aside>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-20 hidden md:hidden transition-opacity"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative w-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-opacity-10">
        
        <!-- Top Header (Glassmorphism) -->
        <header class="h-16 flex items-center justify-between px-4 md:px-8 border-b border-white/5 bg-black/20 backdrop-blur-md sticky top-0 z-10">
            <button onclick="toggleSidebar()" class="md:hidden text-gray-300 hover:text-white p-2 rounded-lg bg-white/5 border border-white/10">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
            
            <div class="mx-auto md:mx-0 flex flex-col items-center md:items-start">
                <span class="md:hidden font-bold text-lg bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-indigo-400">NearsX</span>
            </div>

            <div class="flex items-center gap-3">
                <div class="relative group">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-violet-600 to-indigo-600 rounded-lg blur opacity-30 group-hover:opacity-70 transition duration-300"></div>
                    <select id="model-selector" class="relative bg-black/50 border border-white/10 text-sm rounded-lg px-4 py-2 outline-none text-gray-200 cursor-pointer backdrop-blur-md appearance-none hover:bg-black/70 transition-all font-medium pr-8">
                        <!-- Options injected via JS -->
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xs"></i>
                </div>
            </div>
        </header>

        <!-- Chat Container -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-8 pb-40 scroll-smooth">
            
            <!-- Welcome Screen -->
            <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center animate-fade-in-up">
                <div class="relative mb-8 animate-float">
                    <div class="absolute inset-0 bg-violet-600 rounded-full blur-3xl opacity-20"></div>
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=NearsX&backgroundColor=transparent" alt="AI Bot" class="w-32 h-32 relative z-10 drop-shadow-[0_0_15px_rgba(139,92,246,0.5)]">
                </div>
                <h1 class="text-4xl md:text-5xl font-bold mb-4 tracking-tight">
                    Welcome to <span class="bg-clip-text text-transparent bg-gradient-to-r from-violet-400 via-fuchsia-400 to-indigo-400 animate-gradient">NearsX AI</span>
                </h1>
                <p class="text-gray-400 max-w-md text-sm md:text-base leading-relaxed">
                    Tanyakan apapun, generate ide, tulis kode, atau sekadar ngobrol. Masa depan ada di tanganmu.
                </p>
                
                <!-- Quick Suggestions -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-10 max-w-2xl w-full">
                    <button onclick="setSuggestion('Buatkan kode Python untuk Scraping Data')" class="p-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all text-left flex flex-col gap-1 group">
                        <span class="text-violet-400 text-sm font-semibold group-hover:text-violet-300"><i class="fa-brands fa-python mr-2"></i>Code</span>
                        <span class="text-gray-300 text-sm">Buatkan kode Python untuk Scraping Data</span>
                    </button>
                    <button onclick="setSuggestion('Jelaskan teori Quantum dengan bahasa sederhana')" class="p-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all text-left flex flex-col gap-1 group">
                        <span class="text-fuchsia-400 text-sm font-semibold group-hover:text-fuchsia-300"><i class="fa-solid fa-atom mr-2"></i>Learn</span>
                        <span class="text-gray-300 text-sm">Jelaskan teori Quantum dengan sederhana</span>
                    </button>
                </div>
            </div>
            
        </div>

        <!-- Input Area (Floating & Glassy) -->
        <div class="absolute bottom-0 w-full bg-gradient-to-t from-[#050505] via-[#050505]/80 to-transparent pt-12 pb-6 px-4 md:px-8 z-10">
            <form id="chat-form" class="max-w-4xl mx-auto relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-violet-600 via-fuchsia-600 to-indigo-600 rounded-2xl blur opacity-25 group-focus-within:opacity-60 transition duration-500"></div>
                <div class="relative flex items-end bg-black/60 backdrop-blur-xl rounded-2xl border border-white/10 shadow-2xl overflow-hidden transition-colors">
                    <textarea id="user-input" rows="1" class="w-full bg-transparent text-gray-100 p-4 md:p-5 pr-14 resize-none outline-none max-h-40 font-medium placeholder-gray-500" placeholder="Ketik pesan Anda di sini..."></textarea>
                    
                    <button type="submit" id="send-btn" class="absolute right-3 bottom-3 p-3 bg-white/5 text-gray-300 hover:text-white hover:bg-violet-600 rounded-xl transition-all duration-300 disabled:opacity-50 disabled:hover:bg-white/5 disabled:hover:text-gray-300 flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane text-lg"></i>
                    </button>
                </div>
            </form>
            <p class="text-[11px] text-center text-gray-500 mt-4 tracking-wide font-medium">
                NearsX AI didukung oleh model canggih. Hasil mungkin tidak selalu 100% akurat.
            </p>
        </div>
    </main>

    <script>
        // --- KONFIGURASI ---
        const WORKER_URL = "https://aged-bonus-fba3.desta4254.workers.dev/"; 
        const MODELS = ["gpt-4o", "gpt-5.5", "claude-opus-4.8", "claude-sonnet-5", "gemini-2.0-flash", "deepseek-r1"];
        
        let chatHistory = JSON.parse(localStorage.getItem('nearsx_history')) || [];
        let currentConvId = null;
        let isGenerating = false;

        const ui = {
            chatContainer: document.getElementById('chat-container'),
            chatForm: document.getElementById('chat-form'),
            userInput: document.getElementById('user-input'),
            historyList: document.getElementById('chat-history-list'),
            modelSelector: document.getElementById('model-selector'),
            welcomeScreen: document.getElementById('welcome-screen'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            sendBtn: document.getElementById('send-btn')
        };

        // --- INISIALISASI ---
        function init() {
            MODELS.forEach(m => {
                const opt = new Option(m.toUpperCase(), m);
                if(m === 'gemini-2.0-flash') opt.selected = true; // Default asik
                ui.modelSelector.add(opt);
            });
            renderHistory();
            if (chatHistory.length > 0) loadConv(chatHistory[0].id);
        }

        const genId = () => Math.random().toString(36).substring(2, 15);

        // --- UI HANDLERS ---
        function toggleSidebar() {
            ui.sidebar.classList.toggle('-translate-x-full');
            if(ui.sidebar.classList.contains('-translate-x-full')) {
                ui.sidebarOverlay.classList.add('hidden');
            } else {
                ui.sidebarOverlay.classList.remove('hidden');
            }
        }

        function setSuggestion(text) {
            ui.userInput.value = text;
            ui.userInput.focus();
            ui.userInput.style.height = 'auto';
            ui.userInput.style.height = (ui.userInput.scrollHeight) + 'px';
        }

        // --- HISTORY MANAGEMENT ---
        function createNewChat() {
            currentConvId = genId();
            ui.chatContainer.innerHTML = '';
            ui.chatContainer.appendChild(ui.welcomeScreen);
            ui.welcomeScreen.style.display = 'flex';
            if(window.innerWidth < 768) toggleSidebar();
        }

        function saveHistory(role, content) {
            if (!currentConvId) currentConvId = genId();
            let conv = chatHistory.find(c => c.id === currentConvId);
            if (!conv) {
                // Title generator dari kata pertama
                const title = content.split(' ').slice(0, 4).join(' ') + '...';
                conv = { id: currentConvId, title: title, messages: [] };
                chatHistory.unshift(conv);
            }
            conv.messages.push({ role, content });
            localStorage.setItem('nearsx_history', JSON.stringify(chatHistory));
            renderHistory();
        }

        function renderHistory() {
            ui.historyList.innerHTML = '';
            chatHistory.forEach(conv => {
                const isActive = conv.id === currentConvId;
                const div = document.createElement('div');
                div.className = `group flex justify-between items-center p-3 rounded-xl cursor-pointer text-sm transition-all duration-200 border border-transparent ${isActive ? 'bg-white/10 border-white/10 text-white' : 'text-gray-400 hover:bg-white/5 hover:text-gray-200'}`;
                
                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden" onclick="loadConv('${conv.id}')">
                        <i class="fa-regular fa-message ${isActive ? 'text-violet-400' : 'text-gray-500 group-hover:text-violet-400'} transition-colors"></i>
                        <span class="truncate font-medium">${conv.title}</span>
                    </div>
                    <button class="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-400 transition-all p-1" onclick="deleteChat('${conv.id}', event)">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                ui.historyList.appendChild(div);
            });
        }

        function loadConv(id) {
            currentConvId = id;
            const conv = chatHistory.find(c => c.id === id);
            ui.chatContainer.innerHTML = '';
            ui.welcomeScreen.style.display = 'none';
            if (conv) conv.messages.forEach(msg => appendMsg(msg.role, msg.content, false));
            renderHistory();
            if(window.innerWidth < 768) toggleSidebar();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            chatHistory = chatHistory.filter(c => c.id !== id);
            localStorage.setItem('nearsx_history', JSON.stringify(chatHistory));
            if (currentConvId === id) createNewChat(); else renderHistory();
        }

        function clearAllHistory() {
            if(confirm('Apakah Anda yakin ingin menghapus semua history chat?')) {
                chatHistory = [];
                localStorage.removeItem('nearsx_history');
                createNewChat(); renderHistory();
            }
        }

        // --- CHAT RENDERER ---
        function appendMsg(role, content, isTyping = false) {
            ui.welcomeScreen.style.display = 'none';
            const div = document.createElement('div');
            div.className = `flex gap-4 ${role === 'user' ? 'justify-end' : 'justify-start'} max-w-4xl mx-auto w-full animate-fade-in-up`;
            
            const avatar = role === 'ai' 
                ? `<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-600 flex-shrink-0 flex items-center justify-center shadow-[0_0_15px_rgba(139,92,246,0.4)] border border-white/20 z-10"><i class="fa-solid fa-robot text-white"></i></div>` 
                : '';

            const bubbleWrap = document.createElement('div');
            bubbleWrap.className = `flex gap-4 max-w-full ${role === 'user' ? 'flex-row-reverse' : 'flex-row'}`;
            
            const bubble = document.createElement('div');
            if (role === 'user') {
                bubble.className = 'p-4 rounded-2xl rounded-tr-sm bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-lg shadow-indigo-900/20 max-w-[85%] border border-white/10 font-medium whitespace-pre-wrap';
                bubble.textContent = content;
            } else {
                bubble.className = 'p-5 rounded-2xl rounded-tl-sm bg-black/40 backdrop-blur-md border border-white/10 text-gray-100 markdown-body w-full shadow-xl max-w-full overflow-hidden';
                
                if (isTyping) {
                    bubble.classList.add('typing-cursor');
                    bubbleWrap.innerHTML = avatar;
                    bubbleWrap.appendChild(bubble);
                    div.appendChild(bubbleWrap);
                    ui.chatContainer.appendChild(div);
                    
                    // Smooth Typing Engine
                    let i = 0;
                    const speed = content.length > 500 ? 2 : 5; // Lebih cepat jika text panjang
                    
                    const interval = setInterval(() => {
                        if (i < content.length) {
                            bubble.innerHTML = marked.parse(content.substring(0, i + 3));
                            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
                            i += 3;
                        } else {
                            clearInterval(interval);
                            bubble.classList.remove('typing-cursor');
                            bubble.innerHTML = marked.parse(content);
                            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
                        }
                    }, speed);
                    return;
                } else {
                    bubble.innerHTML = marked.parse(content);
                }
            }
            
            if(role === 'ai') bubbleWrap.innerHTML = avatar;
            bubbleWrap.appendChild(bubble);
            div.appendChild(bubbleWrap);
            ui.chatContainer.appendChild(div);
            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
        }

        // --- INPUT HANDLERS ---
        ui.userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                if(!isGenerating && ui.userInput.value.trim() !== '') {
                    ui.chatForm.dispatchEvent(new Event('submit')); 
                }
            }
        });

        ui.userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim() !== '') {
                ui.sendBtn.classList.add('text-white', 'bg-violet-600');
            } else {
                ui.sendBtn.classList.remove('text-white', 'bg-violet-600');
            }
        });

        // --- SUBMIT / API CALL ---
        ui.chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isGenerating) return;
            
            const question = ui.userInput.value.trim();
            if (!question) return;

            // Reset Input UI
            ui.userInput.value = '';
            ui.userInput.style.height = 'auto';
            ui.sendBtn.classList.remove('text-white', 'bg-violet-600');
            
            appendMsg('user', question);
            saveHistory('user', question);
            
            isGenerating = true;
            ui.sendBtn.disabled = true;

            // Loading state keren
            const loadingDiv = document.createElement('div');
            loadingDiv.className = "flex gap-4 justify-start max-w-4xl mx-auto w-full animate-fade-in-up";
            loadingDiv.innerHTML = `
                <div class="flex gap-4 w-full">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-600 flex-shrink-0 flex items-center justify-center shadow-[0_0_15px_rgba(139,92,246,0.4)] border border-white/20 animate-pulse">
                        <i class="fa-solid fa-robot text-white"></i>
                    </div>
                    <div class="p-5 rounded-2xl rounded-tl-sm bg-black/40 backdrop-blur-md border border-white/10 flex gap-2 items-center h-[60px]">
                        <div class="w-2 h-2 rounded-full bg-violet-400 animate-bounce" style="animation-delay: 0s"></div>
                        <div class="w-2 h-2 rounded-full bg-violet-400 animate-bounce" style="animation-delay: 0.2s"></div>
                        <div class="w-2 h-2 rounded-full bg-violet-400 animate-bounce" style="animation-delay: 0.4s"></div>
                    </div>
                </div>
            `;
            ui.chatContainer.appendChild(loadingDiv);
            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        model: ui.modelSelector.value,
                        conversationId: currentConvId || genId(),
                        webSearch: true
                    })
                });

                const data = await response.json();
                ui.chatContainer.removeChild(loadingDiv);
                
                const aiReply = data.response || data.message || data.text || data.answer || JSON.stringify(data);
                appendMsg('ai', aiReply, true);
                saveHistory('ai', aiReply);

            } catch (error) {
                ui.chatContainer.removeChild(loadingDiv);
                appendMsg('ai', "⚠️ **Error:** Gagal terhubung ke server (Cloudflare Worker). Pastikan link worker aktif.", false);
            } finally {
                isGenerating = false;
                ui.sendBtn.disabled = false;
            }
        });

        // Start
        init();
    </script>
</body>
</html>
