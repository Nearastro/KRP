<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NearsX - Workspace</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#0a0a0a',
                        surface: '#171717',
                        border: '#262626',
                        primary: '#ededed',
                        secondary: '#a1a1aa'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                } 
            }
        }
    </script>
    
    <!-- FontAwesome & Marked -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        
        .typing-cursor::after { content: ''; display: inline-block; width: 5px; height: 1em; background-color: #ededed; margin-left: 2px; vertical-align: text-bottom; animation: blink 1s step-start infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        
        .markdown-body { color: #ededed; font-size: 0.95rem; line-height: 1.7; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body ul, .markdown-body ol { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; color: #d4d4d8; }
        .markdown-body strong { color: #ffffff; font-weight: 600; }
        .markdown-body img { max-width: 100%; border-radius: 0.5rem; margin-top: 0.5rem; border: 1px solid #262626; }
        
        .markdown-body code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.85em; padding: 0.2em 0.4em; background: #27272a; color: #e4e4e7; border-radius: 0.3em; border: 1px solid #3f3f46; }
        .markdown-body pre { margin: 0; }
        .markdown-body pre code { background: transparent; border: none; padding: 0; color: #e4e4e7; }
        
        body { background-color: #0a0a0a; color: #ededed; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        textarea { transition: height 0.1s ease; }
    </style>
</head>
<body class="h-screen flex overflow-hidden font-sans antialiased selection:bg-neutral-700 selection:text-white">

    <!-- Sidebar Minimalis -->
    <aside id="sidebar" class="w-[280px] bg-background border-r border-border flex-shrink-0 flex flex-col transition-transform duration-300 md:relative absolute z-30 h-full -translate-x-full md:translate-x-0">
        <div class="h-14 flex items-center px-5 py-4">
            <span class="text-lg font-semibold tracking-tight text-primary">NearsX.</span>
            <button onclick="toggleSidebar()" class="md:hidden ml-auto text-secondary hover:text-primary transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="px-3 pb-3">
            <button onclick="createNewChat()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg bg-surface border border-border hover:bg-neutral-800 transition-colors text-sm font-medium text-primary">
                <span><i class="fa-solid fa-pen-to-square mr-2 opacity-70"></i> New chat</span>
                <i class="fa-solid fa-plus text-xs opacity-50"></i>
            </button>
        </div>
        
        <div class="px-4 pt-2 pb-1 text-[11px] font-semibold text-secondary uppercase tracking-wider">History</div>
        <div class="flex-1 overflow-y-auto px-2 space-y-0.5 no-scrollbar" id="chat-history-list"></div>

        <div class="p-4 border-t border-border flex justify-between items-center bg-background">
            <div class="flex items-center gap-3">
                <div class="w-7 h-7 rounded-full bg-neutral-800 border border-neutral-700 flex items-center justify-center text-xs">US</div>
                <span class="font-medium text-sm text-primary">Workspace</span>
            </div>
            <button onclick="clearAllHistory()" class="text-secondary hover:text-red-400 transition-colors" title="Clear History">
                <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
        </div>
    </aside>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-20 hidden md:hidden transition-opacity"></div>

    <main class="flex-1 flex flex-col h-full relative w-full bg-background">
        
        <header class="h-14 flex items-center justify-between px-4 sticky top-0 z-10 bg-background/80 backdrop-blur-md border-b border-border/50">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-secondary hover:text-primary transition-colors">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="relative">
                    <select id="model-selector" class="appearance-none bg-transparent hover:bg-surface border border-transparent hover:border-border text-sm rounded-lg pl-3 pr-8 py-1.5 outline-none text-primary cursor-pointer transition-colors font-medium">
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-secondary pointer-events-none text-[10px]"></i>
                </div>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto px-4 md:px-0 py-6 space-y-8 pb-48 scroll-smooth flex flex-col items-center">
            <div id="welcome-screen" class="h-full w-full max-w-3xl flex flex-col items-center justify-center text-center animate-fade-in mt-10">
                <div class="w-16 h-16 rounded-2xl bg-surface border border-border flex items-center justify-center mb-6 shadow-sm">
                    <i class="fa-solid fa-layer-group text-2xl text-secondary"></i>
                </div>
                <h1 class="text-3xl font-semibold mb-3 tracking-tight text-primary">How can I help?</h1>
                <p class="text-secondary text-sm max-w-sm">
                    Upload documents, write code, or start a conversation.
                </p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-10 w-full max-w-xl">
                    <button onclick="setSuggestion('Bantu saya merapikan kode Python ini')" class="p-4 rounded-xl border border-border bg-background hover:bg-surface transition-colors text-left flex flex-col gap-1.5 group shadow-sm">
                        <span class="text-primary text-sm font-medium"><i class="fa-solid fa-code text-secondary mr-2"></i>Code Review</span>
                        <span class="text-secondary text-xs">Bantu saya merapikan kode Python ini</span>
                    </button>
                    <button onclick="setSuggestion('Tuliskan draft email profesional untuk klien')" class="p-4 rounded-xl border border-border bg-background hover:bg-surface transition-colors text-left flex flex-col gap-1.5 group shadow-sm">
                        <span class="text-primary text-sm font-medium"><i class="fa-regular fa-envelope text-secondary mr-2"></i>Draft Email</span>
                        <span class="text-secondary text-xs">Tuliskan draft email profesional untuk klien</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 w-full bg-gradient-to-t from-background via-background to-transparent pt-10 pb-6 px-4 flex justify-center z-10">
            <form id="chat-form" class="w-full max-w-3xl relative">
                <div class="relative flex flex-col bg-surface rounded-2xl border border-border shadow-lg transition-colors focus-within:border-neutral-600 focus-within:ring-1 focus-within:ring-neutral-600">
                    <div id="file-preview-container" class="flex gap-2 px-3 pt-3 overflow-x-auto hidden border-b border-border/50 pb-2"></div>
                    
                    <div class="flex items-end relative min-h-[56px]">
                        <label for="file-upload" class="p-3.5 ml-1 text-secondary hover:text-primary cursor-pointer transition-colors" title="Attach Files">
                            <i class="fa-solid fa-paperclip text-lg"></i>
                        </label>
                        <input type="file" id="file-upload" class="hidden" multiple accept="image/*,.pdf,.txt,.json,.csv,.js,.py,.html">
                        
                        <textarea id="user-input" rows="1" class="w-full bg-transparent text-primary py-4 px-2 resize-none outline-none max-h-48 text-[15px] placeholder-secondary leading-relaxed" placeholder="Message NearsX..."></textarea>
                        
                        <button type="submit" id="send-btn" class="p-2 mb-2 mr-2 rounded-xl bg-primary text-background hover:bg-white transition-all duration-200 disabled:opacity-30 disabled:bg-surface disabled:text-secondary disabled:border disabled:border-border flex items-center justify-center w-9 h-9" disabled>
                            <i class="fa-solid fa-arrow-up text-sm"></i>
                        </button>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <span class="text-[10px] text-neutral-500 font-medium">NearsX AI can make mistakes. Consider verifying important information.</span>
                </div>
            </form>
        </div>
    </main>

    <script>
        // === GANTI DENGAN IP VPS KAMU + PORT 8080 ===
        const WORKER_URL = "http://116.212.73.233:8080/"; 
        
        const MODELS = [
            "gpt-4o", "gpt-5.5", "claude-opus-4.8", "claude-sonnet-5", 
            "deepseek-r1", "deepseek-v3", "deepseek-v4-flash", "gemini-2.0-flash", 
            "gemini-2.5-pro", "grok-4.6"
        ];
        
        let chatHistory = JSON.parse(localStorage.getItem('nearsx_history')) || [];
        let currentConvId = null;
        let isGenerating = false;
        let selectedFiles = [];

        const ui = {
            chatContainer: document.getElementById('chat-container'),
            chatForm: document.getElementById('chat-form'),
            userInput: document.getElementById('user-input'),
            historyList: document.getElementById('chat-history-list'),
            modelSelector: document.getElementById('model-selector'),
            welcomeScreen: document.getElementById('welcome-screen'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            sendBtn: document.getElementById('send-btn'),
            fileInput: document.getElementById('file-upload'),
            filePreview: document.getElementById('file-preview-container')
        };

        function init() {
            MODELS.forEach(m => {
                const opt = new Option(m, m);
                if(m === 'gpt-4o') opt.selected = true;
                ui.modelSelector.add(opt);
            });
            renderHistory();
            if (chatHistory.length > 0) loadConv(chatHistory[0].id);
        }

        const genId = () => Math.random().toString(36).substring(2, 15);

        function toggleSidebar() {
            ui.sidebar.classList.toggle('-translate-x-full');
            ui.sidebarOverlay.classList.toggle('hidden');
        }

        function setSuggestion(text) {
            ui.userInput.value = text;
            ui.userInput.focus();
            autoResizeTextarea();
            checkInputState();
        }

        function createNewChat() {
            currentConvId = genId();
            ui.chatContainer.innerHTML = '';
            ui.chatContainer.appendChild(ui.welcomeScreen);
            ui.welcomeScreen.style.display = 'flex';
            clearFiles();
            if(window.innerWidth < 768 && !ui.sidebar.classList.contains('-translate-x-full')) toggleSidebar();
        }

        function saveHistory(role, content, attachments = []) {
            if (!currentConvId) currentConvId = genId();
            let conv = chatHistory.find(c => c.id === currentConvId);
            if (!conv) {
                const title = content.split(' ').slice(0, 4).join(' ') + '...';
                conv = { id: currentConvId, title: title, messages: [] };
                chatHistory.unshift(conv);
            }
            conv.messages.push({ role, content, attachments });
            localStorage.setItem('nearsx_history', JSON.stringify(chatHistory));
            renderHistory();
        }

        function renderHistory() {
            ui.historyList.innerHTML = '';
            chatHistory.forEach(conv => {
                const isActive = conv.id === currentConvId;
                const div = document.createElement('div');
                div.className = `group flex justify-between items-center p-2.5 rounded-lg cursor-pointer text-sm transition-colors ${isActive ? 'bg-surface text-primary' : 'text-secondary hover:bg-neutral-800 hover:text-primary'}`;
                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden w-full" onclick="loadConv('${conv.id}')">
                        <span class="truncate font-medium">${conv.title}</span>
                    </div>
                    <button class="opacity-0 group-hover:opacity-100 text-neutral-500 hover:text-red-400 transition-all ml-2" onclick="deleteChat('${conv.id}', event)">
                        <i class="fa-solid fa-trash-can text-[11px]"></i>
                    </button>
                `;
                ui.historyList.appendChild(div);
            });
        }

        function loadConv(id) {
            currentConvId = id;
            const conv = chatHistory.find(c => c.id === id);
            ui.chatContainer.innerHTML = '';
            ui.welcomeScreen.style.display = 'none';
            if (conv) conv.messages.forEach(msg => appendMsg(msg.role, msg.content, false, msg.attachments));
            renderHistory();
            if(window.innerWidth < 768 && !ui.sidebar.classList.contains('-translate-x-full')) toggleSidebar();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            chatHistory = chatHistory.filter(c => c.id !== id);
            localStorage.setItem('nearsx_history', JSON.stringify(chatHistory));
            if (currentConvId === id) createNewChat(); else renderHistory();
        }

        function clearAllHistory() {
            if(confirm('Clear all conversation history?')) {
                chatHistory = []; localStorage.removeItem('nearsx_history');
                createNewChat(); renderHistory();
            }
        }

        function formatCodeBlocks(container) {
            const pres = container.querySelectorAll('pre');
            pres.forEach(pre => {
                if (pre.parentNode.classList.contains('code-wrapper')) return;
                
                const codeNode = pre.querySelector('code');
                const lang = codeNode && codeNode.className ? codeNode.className.replace('language-', '') : 'text';
                const codeText = codeNode ? codeNode.innerText : pre.innerText;

                const wrapper = document.createElement('div');
                wrapper.className = 'code-wrapper my-4 rounded-xl overflow-hidden bg-[#0d0d0d] border border-border shadow-sm';
                
                const header = document.createElement('div');
                header.className = 'flex justify-between items-center px-4 py-2 bg-[#171717] border-b border-border text-xs text-secondary font-mono';
                header.innerHTML = `
                    <span class="lowercase">${lang}</span>
                    <button class="copy-btn flex items-center gap-1.5 hover:text-primary transition-colors" title="Copy code">
                        <i class="fa-regular fa-clone"></i> <span>Copy</span>
                    </button>
                `;
                
                const copyBtn = header.querySelector('.copy-btn');
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(codeText).then(() => {
                        copyBtn.innerHTML = '<i class="fa-solid fa-check text-green-500"></i> <span class="text-green-500">Copied</span>';
                        setTimeout(() => {
                            copyBtn.innerHTML = '<i class="fa-regular fa-clone"></i> <span>Copy</span>';
                        }, 2000);
                    });
                });

                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(header);
                
                const codeContent = document.createElement('div');
                codeContent.className = 'p-4 overflow-x-auto text-[13px] leading-relaxed font-mono';
                codeContent.appendChild(pre);
                wrapper.appendChild(codeContent);
            });
        }

        function appendMsg(role, content, isTyping = false, attachments = []) {
            ui.welcomeScreen.style.display = 'none';
            
            const div = document.createElement('div');
            div.className = `flex w-full max-w-3xl animate-fade-in mb-6 ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            let attachmentHTML = '';
            if (attachments && attachments.length > 0) {
                attachmentHTML = `<div class="flex flex-wrap gap-2 mb-2">`;
                attachments.forEach(att => {
                    if (att.type && att.type.startsWith('image/')) {
                        attachmentHTML += `<img src="${att.url}" class="h-24 w-auto rounded-lg border border-border object-cover">`;
                    } else {
                        attachmentHTML += `<div class="flex items-center gap-2 bg-surface px-3 py-2 rounded-lg border border-border text-xs font-medium text-primary"><i class="fa-solid fa-file-lines text-secondary"></i> ${att.name}</div>`;
                    }
                });
                attachmentHTML += `</div>`;
            }

            const bubble = document.createElement('div');
            
            if (role === 'user') {
                bubble.className = 'px-5 py-3 rounded-2xl rounded-tr-sm bg-surface border border-border text-primary max-w-[85%] text-[15px] leading-relaxed shadow-sm';
                bubble.innerHTML = attachmentHTML + (content ? `<div>${content}</div>` : '');
                div.appendChild(bubble);
            } else {
                bubble.className = 'text-primary markdown-body w-full max-w-full overflow-hidden flex gap-4';
                
                const avatar = document.createElement('div');
                avatar.className = 'w-8 h-8 rounded-full border border-border flex items-center justify-center flex-shrink-0 mt-0.5 bg-background shadow-sm';
                avatar.innerHTML = '<i class="fa-solid fa-sparkles text-[11px] text-primary"></i>';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'flex-1 min-w-0';

                if (isTyping) {
                    contentDiv.classList.add('typing-cursor');
                    bubble.appendChild(avatar);
                    bubble.appendChild(contentDiv);
                    div.appendChild(bubble);
                    ui.chatContainer.appendChild(div);
                    
                    let i = 0;
                    const speed = content.length > 500 ? 1 : 4; 
                    const interval = setInterval(() => {
                        if (i < content.length) {
                            contentDiv.innerHTML = marked.parse(content.substring(0, i + 3));
                            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight; 
                            i += 3;
                        } else {
                            clearInterval(interval);
                            contentDiv.classList.remove('typing-cursor');
                            contentDiv.innerHTML = marked.parse(content);
                            formatCodeBlocks(contentDiv);
                            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
                        }
                    }, speed);
                    return;
                } else {
                    contentDiv.innerHTML = marked.parse(content);
                    formatCodeBlocks(contentDiv);
                    bubble.appendChild(avatar);
                    bubble.appendChild(contentDiv);
                    div.appendChild(bubble);
                }
            }
            
            ui.chatContainer.appendChild(div); 
            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
        }

        ui.fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (selectedFiles.length + files.length > 5) {
                alert("Maximum 5 files allowed per message."); return;
            }
            selectedFiles = [...selectedFiles, ...files];
            renderFilePreviews();
            checkInputState();
            ui.fileInput.value = ''; 
        });

        function renderFilePreviews() {
            if (selectedFiles.length === 0) {
                ui.filePreview.classList.add('hidden');
                ui.filePreview.innerHTML = '';
                return;
            }
            ui.filePreview.classList.remove('hidden');
            ui.filePreview.innerHTML = '';
            
            selectedFiles.forEach((file, index) => {
                const isImage = file.type.startsWith('image/');
                const div = document.createElement('div');
                div.className = "relative group flex-shrink-0 mb-1";
                
                if (isImage) {
                    const url = URL.createObjectURL(file);
                    div.innerHTML = `<div class="h-14 w-14 rounded-lg border border-border overflow-hidden bg-background"><img src="${url}" class="h-full w-full object-cover opacity-90 group-hover:opacity-100 transition-opacity"></div>`;
                } else {
                    div.innerHTML = `<div class="h-14 w-14 flex flex-col items-center justify-center bg-background rounded-lg border border-border text-[10px] text-secondary p-1"><i class="fa-regular fa-file-lines mb-1 text-base"></i><span class="truncate w-full text-center">${file.name}</span></div>`;
                }
                
                div.innerHTML += `
                    <button type="button" onclick="removeFile(${index})" class="absolute -top-1.5 -right-1.5 bg-neutral-700 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px] opacity-0 group-hover:opacity-100 transition-opacity shadow border border-neutral-600 hover:bg-neutral-600">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                ui.filePreview.appendChild(div);
            });
        }

        window.removeFile = function(index) {
            selectedFiles.splice(index, 1);
            renderFilePreviews();
            checkInputState();
        }

        function clearFiles() {
            selectedFiles = [];
            renderFilePreviews();
        }

        function autoResizeTextarea() {
            ui.userInput.style.height = 'auto';
            let newHeight = ui.userInput.scrollHeight;
            ui.userInput.style.height = (newHeight > 200 ? 200 : newHeight) + 'px';
        }
        
        function checkInputState() {
            if(ui.userInput.value.trim() !== '' || selectedFiles.length > 0) {
                ui.sendBtn.removeAttribute('disabled');
            } else {
                ui.sendBtn.setAttribute('disabled', 'true');
            }
        }

        ui.userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                if(!isGenerating && (ui.userInput.value.trim() !== '' || selectedFiles.length > 0)) {
                    ui.chatForm.dispatchEvent(new Event('submit')); 
                }
            }
        });
        ui.userInput.addEventListener('input', () => { autoResizeTextarea(); checkInputState(); });

        // --- PENANGANAN RESPONSE STREAM / TEXT / JSON (FIX ERROR UNEXPECTED TOKEN) ---
        ui.chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isGenerating) return;
            
            const question = ui.userInput.value.trim();
            if (!question && selectedFiles.length === 0) return;

            const currentFiles = [...selectedFiles];
            const attachmentsForHistory = currentFiles.map(f => ({
                name: f.name,
                type: f.type,
                url: f.type.startsWith('image/') ? URL.createObjectURL(f) : null
            }));

            ui.userInput.value = '';
            ui.userInput.style.height = 'auto';
            clearFiles();
            checkInputState();
            
            appendMsg('user', question, false, attachmentsForHistory);
            saveHistory('user', question, attachmentsForHistory);
            
            isGenerating = true;
            ui.sendBtn.setAttribute('disabled', 'true');
            ui.sendBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-sm"></i>';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = "flex w-full max-w-3xl animate-fade-in mb-6 justify-start";
            loadingDiv.innerHTML = `
                <div class="flex gap-4">
                    <div class="w-8 h-8 rounded-full border border-border flex items-center justify-center flex-shrink-0 mt-0.5 bg-background"><i class="fa-solid fa-sparkles text-[11px] text-secondary"></i></div>
                    <div class="flex items-center gap-1.5 h-9 px-2">
                        <div class="w-1.5 h-1.5 rounded-full bg-secondary animate-bounce" style="animation-delay: 0s"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-secondary animate-bounce" style="animation-delay: 0.15s"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-secondary animate-bounce" style="animation-delay: 0.3s"></div>
                    </div>
                </div>
            `;
            ui.chatContainer.appendChild(loadingDiv);
            ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;

            try {
                let fetchOptions = { method: 'POST' };

                if (currentFiles.length > 0) {
                    const formData = new FormData();
                    formData.append('question', question || "Analyze this file.");
                    formData.append('model', ui.modelSelector.value);
                    formData.append('conversationId', currentConvId || genId());
                    formData.append('webSearch', 'true');
                    
                    currentFiles.forEach(file => { formData.append('files', file); });
                    fetchOptions.body = formData;
                } else {
                    fetchOptions.headers = { 'Content-Type': 'application/json' };
                    fetchOptions.body = JSON.stringify({
                        question: question,
                        model: ui.modelSelector.value,
                        conversationId: currentConvId || genId(),
                        webSearch: true
                    });
                }

                const response = await fetch(WORKER_URL, fetchOptions);
                const rawText = await response.text();
                
                ui.chatContainer.removeChild(loadingDiv);
                
                let aiReply = "";

                // Ekstraksi data jika formatnya SSE / Streaming Text (data: {...})
                if (rawText.includes('data:')) {
                    const lines = rawText.split('\n');
                    for (let line of lines) {
                        line = line.trim();
                        if (line.startsWith('data:')) {
                            const jsonStr = line.replace(/^data:\s*/, '');
                            if (jsonStr === '[DONE]') continue;
                            try {
                                const parsed = JSON.parse(jsonStr);
                                if (parsed.response) aiReply += parsed.response;
                                else if (parsed.message) aiReply += parsed.message;
                                else if (parsed.text) aiReply += parsed.text;
                                else if (parsed.content) aiReply += parsed.content;
                            } catch (err) {
                                // Jika potongan bukan JSON valid, ambil mentahnya
                                aiReply += jsonStr;
                            }
                        }
                    }
                } 

                // Parsing jika formatnya JSON murni
                if (!aiReply) {
                    try {
                        const parsed = JSON.parse(rawText);
                        aiReply = parsed.response || parsed.message || parsed.text || parsed.answer || JSON.stringify(parsed);
                    } catch (err) {
                        // Jika teks biasa
                        aiReply = rawText;
                    }
                }

                if (!aiReply.trim()) aiReply = "⚠️ Respon kosong dari server API.";

                appendMsg('ai', aiReply, true);
                saveHistory('ai', aiReply);

            } catch (error) {
                ui.chatContainer.removeChild(loadingDiv);
                appendMsg('ai', "⚠️ **Connection Error:** " + error.message, false);
            } finally {
                isGenerating = false;
                ui.sendBtn.innerHTML = '<i class="fa-solid fa-arrow-up text-sm"></i>';
                checkInputState();
            }
        });

        init();
    </script>
</body>
</html>
